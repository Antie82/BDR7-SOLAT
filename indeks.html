        function sendEvaluationToSheets() {
            const name = document.getElementById('inputStudentName').value.trim();
            const cls = document.getElementById('inputStudentClass').value.trim();
            if (!name || !cls) {
                showModal("Peringatan", "Mohon masukkan Nama Lengkap dan Kelas Anda terlebih dahulu.");
                return;
            }

            studentName = name;
            studentClass = cls;
            localStorage.setItem('pai_student_name', name);
            localStorage.setItem('pai_student_class', cls);

            const score = localStorage.getItem('pai_last_score') || '0';
            const correct = localStorage.getItem('pai_last_correct') || '0';
            const incorrect = localStorage.getItem('pai_last_incorrect') || '20';
            const time = localStorage.getItem('pai_last_time') || '0m';

            // Check if Google Sheets URL is placeholder
            if (GOOGLE_SHEETS_URL.includes('PLACEHOLDER')) {
                showModal("Informasi Google Sheets", "Data belum terhubung ke Google Sheets. Silakan hubungi guru.\n\n(Catatan: Data tersimpan lokal di perangkat Anda).");
                return;
            }

            // Send via fetch
            const data = {
                tanggal: new Date().toISOString().split('T')[0],
                nama: name,
                kelas: cls,
                materi: "Sholat Lima Waktu",
                jumlahSoal: 20,
                benar: correct,
                salah: incorrect,
                nilai: score,
                persentase: `${score}%`,
                waktu: time,
                refleksi: studentRefleksi.paham || '-'
            };

            fetch(GOOGLE_SHEETS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                showModal("Berhasil", "Hasil evaluasi berhasil dikirim ke Google Sheets guru!");
            }).catch(() => {
                showModal("Catatan", "Data belum terhubung ke Google Sheets. Silakan hubungi guru.");
            });
        }

                <div class="space-y-6">
                    <div class="border-b border-slate-100 dark:border-slate-700 pb-4">
                        <span class="text-xs font-bold text-islamic-600 uppercase tracking-wider">Q. Refleksi</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-slate-100 mt-1">Refleksi Pembelajaran Siswa</h2>
                    </div>
                    <p class="text-sm text-slate-600 dark:text-slate-400">Jawablah pertanyaan refleksi di bawah ini dengan jujur untuk evaluasi diri:</p>

                    <div class="space-y-4 max-w-2xl mx-auto">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">1. Apa yang saya pahami hari ini?</label>
                            <textarea id="refPaham" oninput="saveRefleksi()" rows="3" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-islamic-500" placeholder="Tuliskan pemahamanmu...">${studentRefleksi.paham}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">2. Bacaan apa yang masih perlu saya hafalkan?</label>
                            <textarea id="refHafal" oninput="saveRefleksi()" rows="3" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-islamic-500" placeholder="Contoh: Doa iftitah atau tahiyyat...">${studentRefleksi.hafal}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">3. Bagian tata cara sholat apa yang masih perlu saya pelajari?</label>
                            <textarea id="refTataCara" oninput="saveRefleksi()" rows="3" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-islamic-500" placeholder="Tuliskan bagian gerakan...">${studentRefleksi.tataCara}</textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">4. Apa yang akan saya lakukan agar sholat lima waktu lebih tertib?</label>
                            <textarea id="refTertib" oninput="saveRefleksi()" rows="3" class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-islamic-500" placeholder="Tuliskan komitmenmu...">${studentRefleksi.tertib}</textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveRefleksi() {
            studentRefleksi.paham = document.getElementById('refPaham').value;
            studentRefleksi.hafal = document.getElementById('refHafal').value;
            studentRefleksi.tataCara = document.getElementById('refTataCara').value;
            studentRefleksi.tertib = document.getElementById('refTertib').value;

            localStorage.setItem('pai_ref_paham', studentRefleksi.paham);
            localStorage.setItem('pai_ref_hafal', studentRefleksi.hafal);
            localStorage.setItem('pai_ref_tatacara', studentRefleksi.tataCara);
            localStorage.setItem('pai_ref_tertib', studentRefleksi.tertib);
        }

        function renderSumberBelajar(container) {
            container.innerHTML = `
                <div class="space-y-6">
                    <div class="border-b border-slate-100 dark:border-slate-700 pb-4">
                        <span class="text-xs font-bold text-islamic-600 uppercase tracking-wider">R. Sumber Belajar</span>
                        <h2 class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-slate-100 mt-1">Daftar Pustaka & Sumber Referensi</h2>
                    </div>
                    <div class="space-y-3 text-sm text-slate-600 dark:text-slate-300">
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-700">
                            <h4 class="font-bold text-slate-800 dark:text-slate-100">1. Buku Paket PAI & Budi Pekerti Kelas VII SMP</h4>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Kementerian Pendidikan, Kebudayaan, Riset, dan Teknologi Republik Indonesia.</p>
                        </div>
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-700">
                            <h4 class="font-bold text-slate-800 dark:text-slate-100">2. Al-Qur'an dan Terjemahannya</h4>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Kementerian Agama Republik Indonesia.</p>
                        </div>
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-700">
                            <h4 class="font-bold text-slate-800 dark:text-slate-100">3. Fiqih Ibadah Sehari-hari</h4>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Panduan praktis ibadah sholat fardhu dan sunnah.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Modal Utility
        function showModal(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('modalContainer').classList.remove('hidden');
            document.getElementById('modalContainer').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modalContainer').classList.remove('flex');
            document.getElementById('modalContainer').classList.add('hidden');
        }
    </script>
</body>
</html>
